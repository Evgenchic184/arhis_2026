stages:
  preprocess:
    cmd: uv run python -m src.pipeline.preprocess_data
    deps:
      - data/cyberbullying_tweets.csv
      - params.yaml
      - src/pipeline/preprocess_data.py
      - src/feature_store/feature_sets.py
      - src/feature_store/offline.py
      - src/feature_store/schemas.py
      - src/transformations/text.py
      - src/utils.py
    outs:
      - data/all_data.parquet
      - data/train.parquet
      - data/val.parquet
      - data/test.parquet
      - data/with_user_features.parquet

  materialize_offline_feature_store:
    cmd: uv run python -m src.pipeline.materialize_offline_feature_store
    deps:
      - params.yaml
      - logs/moderation_events.jsonl
      - src/pipeline/materialize_offline_feature_store.py
      - src/utils.py
    outs:
      - data/offline_feature_store/offline_training.parquet

  build_retraining_dataset:
    cmd: uv run python -m src.pipeline.build_retraining_dataset
    deps:
      - params.yaml
      - src/pipeline/build_retraining_dataset.py
      - src/app/services/event_archive.py
      - src/app/services/drift.py
      - src/transformations/text.py
      - src/utils.py
    outs:
      - data/retraining/retraining_dataset.parquet
      - data/retraining/baseline_vocab.json

  retrain_model:
    cmd: uv run python -m src.pipeline.retrain_model
    deps:
      - params.yaml
      - data/train.parquet
      - data/retraining/retraining_dataset.parquet
      - data/retraining/baseline_vocab.json
      - src/pipeline/retrain_model.py
      - src/pipeline/train_model.py
      - src/pipeline/build_retraining_dataset.py
      - src/app/core/database.py
      - src/app/core/settings.py
      - src/app/services/model_registry.py
      - src/app/services/event_archive.py
      - src/app/services/drift.py
      - src/app/models/model_registry.py
      - src/app/models/enums.py
      - src/feature_store/config.py
      - src/feature_store/feature_sets.py
      - src/utils.py
    outs:
      - models/retraining/cyberbullying_moderation.joblib
      - models/retraining/training_metadata.json
      - reports/retraining/validation_report.json
      - reports/retraining/model_registry_report.json

  train:
    cmd: uv run python -m src.pipeline.train_model
    deps:
      - params.yaml
      - data/train.parquet
      - src/pipeline/train_model.py
      - src/app/core/settings.py
      - src/app/core/feature_config.py
      - src/feature_store/feature_sets.py
      - src/feature_store/config.py
      - src/utils.py
    outs:
      - models/cyberbullying_moderation.joblib
      - models/training_metadata.json

  train_canary_model:
    cmd: uv run python -m src.pipeline.train_canary_model
    deps:
      - params.yaml
      - data/train.parquet
      - data/val.parquet
      - data/test.parquet
      - src/pipeline/train_canary_model.py
      - src/pipeline/train_model.py
      - src/pipeline/evaluate_model.py
      - src/app/core/settings.py
      - src/feature_store/feature_sets.py
      - src/feature_store/config.py
      - src/utils.py
    outs:
      - models/canary_test/cyberbullying_moderation.joblib
      - models/canary_test/training_metadata.json
    metrics:
      - reports/canary_validation_report.json:
          cache: false

  evaluate:
    cmd: uv run python -m src.pipeline.evaluate_model
    deps:
      - params.yaml
      - data/val.parquet
      - data/test.parquet
      - models/cyberbullying_moderation.joblib
      - src/pipeline/evaluate_model.py
      - src/feature_store/feature_sets.py
      - src/utils.py
    metrics:
      - reports/validation_report.json:
          cache: false

  register_model:
    cmd: uv run python -m src.pipeline.register_model
    deps:
      - params.yaml
      - data/val.parquet
      - models/cyberbullying_moderation.joblib
      - models/training_metadata.json
      - reports/validation_report.json
      - src/pipeline/register_model.py
      - src/app/core/database.py
      - src/app/core/settings.py
      - src/app/services/model_registry.py
      - src/app/models/model_registry.py
      - src/app/models/enums.py
      - src/feature_store/feature_sets.py
      - src/utils.py
    outs:
      - reports/model_registry_report.json

  register_canary_model:
    cmd: uv run python -m src.pipeline.register_canary_model
    deps:
      - params.yaml
      - data/val.parquet
      - models/canary_test/cyberbullying_moderation.joblib
      - models/canary_test/training_metadata.json
      - reports/canary_validation_report.json
      - src/pipeline/register_canary_model.py
      - src/app/core/database.py
      - src/app/core/settings.py
      - src/app/services/model_registry.py
      - src/app/models/model_registry.py
      - src/app/models/enums.py
      - src/feature_store/feature_sets.py
      - src/utils.py
    outs:
      - reports/canary_model_registry_report.json
