global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: arhis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: arhis-ml-inference-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-inference-worker:8011"]
  - job_name: arhis-retraining-monitor
    metrics_path: /metrics
    static_configs:
      - targets: ["retraining-monitor:8012"]
